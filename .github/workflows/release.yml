# This file is automatically generated from Nix configuration. Do not edit directly.

concurrency:
  cancel-in-progress: false
  group: release-${{ inputs.release_tag }}
jobs:
  release:
    env:
      DL_TAG: ${{ inputs.download_tag }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        id: secrets
        name: decrypt-github-app-secrets
        run: |
          client_id=$(nix develop -c sops-decrypt app_client_id)
          private_key=$(nix develop -c sops-decrypt app_private_key)
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::add-mask::$line"
          done <<<"$private_key"
          delim=$(openssl rand -hex 16)
          {
            echo "client_id=$client_id"
            echo "private_key<<$delim"
            echo "$private_key"
            echo "$delim"
          } >>"$GITHUB_OUTPUT"
      - id: app
        name: github-app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ steps.secrets.outputs.client_id }}
          owner: CoreStory-Frontier
          private-key: ${{ steps.secrets.outputs.private_key }}
          repositories: plot
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        name: download
        run: nix run .#download -- "$DL_TAG" dist
      - name: latest-json
        run: |
          nix run .#latest-json -- \
            --tag "$RELEASE_TAG" \
            --base-url "https://github.com/${{ github.repository }}/releases/download" \
            --dist dist
      - env:
          GH_TOKEN: ${{ github.token }}
        name: release-create
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            -R "${{ github.repository }}" \
            --title "$RELEASE_TAG" \
            --notes-file notes.md
name: release
"on":
  workflow_dispatch:
    inputs:
      download_tag:
        description: download tag
        required: true
        type: string
      release_tag:
        description: release tag
        required: true
        type: string
permissions:
  contents: write
run-name: Release ${{ inputs.release_tag }}
